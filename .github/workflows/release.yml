name: Build Windows packages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare local speech models
        run: npm run speech:prepare
      - name: Check source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows packages
        run: npm run dist -- --publish never
      - name: Save packages for review
        uses: actions/upload-artifact@v4
        with:
          name: cuteQ-windows-x64
          path: artifacts/cuteQ-*.exe
          if-no-files-found: error
          retention-days: 7
